<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}AI Resume Matcher{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #1f2937;
            padding: 15px 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .score {
            font-size: 40px;
            font-weight: bold;
        }

        .skill {
            display: inline-block;
            background: #e5e7eb;
            padding: 6px 10px;
            margin: 4px;
            border-radius: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="/resumes/upload/">Upload Resume</a>
        <a href="/jobs/create/">Add Job</a>
        <a href="/matcher/">Analyze</a>
        <a href="/matcher/history/">History</a>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
